<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">
            📚 Papelería Tony
        </a>
    </div>
</nav>

<div class="container">

    <div class="row justify-content-center my-5">

        <div class="col-lg-7">

            <div class="card shadow-lg">

                <div class="card-header bg-primary text-white text-center">
                    <h3>Crear Cuenta</h3>
                </div>

                <div class="card-body">

                    <form>

                        <div class="row">

                            <div class="col-md-4 mb-3">
                                <label class="form-label">
                                    Nombre
                                </label>

                                <input
                                    type="text"
                                    class="form-control">
                            </div>

                            <div class="col-md-4 mb-3">
                                <label class="form-label">
                                    Apellido Paterno
                                </label>

                                <input
                                    type="text"
                                    class="form-control">
                            </div>

                            <div class="col-md-4 mb-3">
                                <label class="form-label">
                                    Apellido Materno
                                </label>

                                <input
                                    type="text"
                                    class="form-control">
                            </div>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Correo Electrónico
                            </label>

                            <input
                                type="email"
                                class="form-control">

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Teléfono
                            </label>

                            <input
                                type="text"
                                class="form-control">

                        </div>

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Contraseña
                                </label>

                                <input
                                    type="password"
                                    class="form-control">

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Confirmar Contraseña
                                </label>

                                <input
                                    type="password"
                                    class="form-control">

                            </div>

                        </div>

                        <button
                            type="submit"
                            class="btn btn-success w-100">

                            Crear Cuenta

                        </button>

                    </form>

                    <hr>

                    <div class="text-center">

                        <a
                            href="login.html"
                            class="btn btn-outline-primary">

                            Ya tengo cuenta

                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
