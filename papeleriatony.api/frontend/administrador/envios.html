<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Envíos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand" href="dashboard.html">
            ⚙️ Administrador
        </a>

        <a href="dashboard.html" class="btn btn-warning">
            Dashboard
        </a>

    </div>

</nav>

<div class="container my-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2>🚚 Gestión de Envíos</h2>

        <button class="btn btn-success">
            Nuevo Envío
        </button>

    </div>

    <div class="card shadow">

        <div class="card-body">

            <div class="table-responsive">

                <table class="table table-hover">

                    <thead class="table-dark">

                        <tr>
                            <th>ID Envío</th>
                            <th>Pedido</th>
                            <th>Cliente</th>
                            <th>Paquetería</th>
                            <th>Guía</th>
                            <th>Fecha Envío</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>

                    </thead>

                    <tbody>

                        <tr>

                            <td>1</td>
                            <td>#1001</td>
                            <td>Juan Pérez</td>
                            <td>DHL</td>
                            <td>DH123456789MX</td>
                            <td>17/11/2026</td>

                            <td>
                                <span class="badge bg-info">
                                    En Camino
                                </span>
                            </td>

                            <td>

                                <button class="btn btn-primary btn-sm">
                                    Ver
                                </button>

                                <button class="btn btn-success btn-sm">
                                    Actualizar
                                </button>

                            </td>

                        </tr>

                        <tr>

                            <td>2</td>
                            <td>#1002</td>
                            <td>María López</td>
                            <td>FedEx</td>
                            <td>FX987654321MX</td>
                            <td>15/11/2026</td>

                            <td>
                                <span class="badge bg-success">
                                    Entregado
                                </span>
                            </td>

                            <td>

                                <button class="btn btn-primary btn-sm">
                                    Ver
                                </button>

                                <button class="btn btn-success btn-sm">
                                    Actualizar
                                </button>

                            </td>

                        </tr>

                        <tr>

                            <td>3</td>
                            <td>#1003</td>
                            <td>Carlos Ruiz</td>
                            <td>Estafeta</td>
                            <td>ES456123789MX</td>
                            <td>14/11/2026</td>

                            <td>
                                <span class="badge bg-warning text-dark">
                                    Pendiente
                                </span>
                            </td>

                            <td>

                                <button class="btn btn-primary btn-sm">
                                    Ver
                                </button>

                                <button class="btn btn-success btn-sm">
                                    Actualizar
                                </button>

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

</body>
</html>
