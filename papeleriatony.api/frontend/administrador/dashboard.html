<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Administrador</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">

        <span class="navbar-brand">
            ⚙️ Panel Administrador
        </span>

        <a href="../index.html" class="btn btn-warning">
            Ir a la tienda
        </a>

    </div>
</nav>

<div class="container my-5">

    <h2 class="mb-4">
        Dashboard
    </h2>

    <div class="row g-4">

        <div class="col-md-3">
            <div class="card bg-primary text-white shadow">
                <div class="card-body text-center">
                    <h5>Usuarios</h5>
                    <h2>120</h2>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card bg-success text-white shadow">
                <div class="card-body text-center">
                    <h5>Productos</h5>
                    <h2>350</h2>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card bg-warning shadow">
                <div class="card-body text-center">
                    <h5>Pedidos</h5>
                    <h2>40</h2>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card bg-danger text-white shadow">
                <div class="card-body text-center">
                    <h5>Ventas</h5>
                    <h2>$52,000</h2>
                </div>
            </div>
        </div>

    </div>

    <hr class="my-5">

    <div class="row g-4">

        <div class="col-md-4">
            <a href="productos.html" class="btn btn-primary w-100 p-4">
                📦 Administración de Productos
            </a>
        </div>

        <div class="col-md-4">
            <a href="categorias.html" class="btn btn-success w-100 p-4">
                📚 Categorías
            </a>
        </div>

        <div class="col-md-4">
            <a href="proveedores.html" class="btn btn-secondary w-100 p-4">
                🚚 Proveedores
            </a>
        </div>

        <div class="col-md-4">
            <a href="usuarios.html" class="btn btn-warning w-100 p-4">
                👥 Usuarios
            </a>
        </div>

        <div class="col-md-4">
            <a href="pedidos.html" class="btn btn-info w-100 p-4">
                📋 Pedidos
            </a>
        </div>

        <div class="col-md-4">
            <a href="envios.html" class="btn btn-dark w-100 p-4">
                🚛 Envíos
            </a>
        </div>

    </div>

</div>

</body>
</html>
